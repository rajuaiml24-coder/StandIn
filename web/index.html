<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="StandIn - know your attendance and safe limit.">
  <meta name="theme-color" content="#14213D">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="StandIn">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StandIn</title>
  <link rel="manifest" href="manifest.json">
  <meta name="google-signin-client_id" content="645644256889-fta4md48g87u4httj005egv22gf80j3g.apps.googleusercontent.com">

  <style>
    body {
      background-color: #F6F7FB;
      margin: 0;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }
    #loading img {
      width: 180px;
      margin-bottom: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #E8EBF1;
      border-top: 4px solid #14213D;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="assets/brand/standin_logo.png" alt="StandIn Logo">
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    var deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (typeof window.dispatchAppEvent === 'function') {
        window.dispatchAppEvent('pwa_install_available', true);
      }
    });

    window.addEventListener('appinstalled', (evt) => {
      deferredPrompt = null;
      if (typeof window.dispatchAppEvent === 'function') {
        window.dispatchAppEvent('pwa_install_available', false);
      }
    });

    window.triggerPwaInstall = async function() {
      if (!deferredPrompt) return false;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        deferredPrompt = null;
      }
      return outcome === 'accepted';
    };

    window.isPwaInstalled = function() {
      return !!(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone);
    };
  </script>
</body>
</html>
