name: standin
description: StandIn - offline-first attendance and workday planning.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  drift: ^2.21.0
  drift_flutter: ^0.2.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.0
  google_mobile_ads: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/standin_logo.png
