name: standin
description: StandIn - offline-first attendance and workday planning.
publish_to: "none"
version: 0.1.0+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  drift: ^2.21.0
  drift_flutter: ^0.2.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.0
  google_mobile_ads: ^5.2.0
  google_sign_in: ^6.2.1
  crypto: ^3.0.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.2
  mocktail: ^1.0.5
  fake_cloud_firestore: ^3.1.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/brand/standin_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/brand/standin_logo.png"
  android_12:
    image: "assets/brand/standin_logo.png"
    color: "#ffffff"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
